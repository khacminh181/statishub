<!DOCTYPE html>
<html>
<head>
  <title>Admin – API Keys</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    td, th { border: 1px solid #ddd; padding: 8px; vertical-align: top; }
    th { background: #f4f4f4; }
    form { display: inline-block; margin: 4px 0; }
    input { padding: 4px; }
    code { font-size: 12px; }
  </style>
</head>
<body>

<h2>API Keys Admin</h2>

<h3>Create API Key</h3>
<form method="post" action="/admin-ui/api-keys/create">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input name="client_name" placeholder="Client name" required>
  <input name="credits" type="number" value="1000">
  <button>Create</button>
</form>

<hr>

<table>
  <tr>
    <th>Client</th>
    <th>API Key</th>
    <th>Rate Limit (req/hour)</th>
    <th>Credits</th>
    <th>Actions</th>
  </tr>

  {% for i in items %}
  <tr>
    <td>{{ i.client_name }}</td>

    <td>
      <code>{{ i.api_key }}</code>
    </td>

    <!-- RATE LIMIT -->
    <td>
      <form method="post" action="/admin-ui/api-keys/{{ i.api_key }}/rate-limit">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input
          type="number"
          name="limit"
          value="{{ i.rate_limit }}"
          style="width: 80px"
          min="1"
        />
        <button>Update</button>
      </form>
    </td>

    <td>{{ i.credits }}</td>

    

    <!-- ACTIONS -->
    <td>
      <form method="post" action="/admin-ui/api-keys/{{ i.api_key }}/revoke">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button>Revoke</button>
      </form>

      <form method="post" action="/admin-ui/api-keys/{{ i.api_key }}/credit">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input name="amount" type="number" placeholder="+credits">
        <button>Add</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>

</body>
</html>
